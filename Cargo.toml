[workspace]
resolver = "2"
members = [
  "packages/core",
  "packages/host",
  "packages/shell",
  "apps/server",
  "apps/desktop/src-tauri",
  "apps/mobile/src-tauri",
]

# Корневые `cargo build`/`cargo test` работают только с ядром.
#
# Оболочки остаются членами workspace (общий `Cargo.lock`, общий `target/`), но
# в сборку по умолчанию не входят: они собираются своим `cargo tauri build`
# либо явным `-p typsidian-desktop` / `-p typsidian-mobile`. Без этого
# `cargo build --target wasm32-unknown-unknown` в корне тянул бы Tauri, GTK и
# WebKit под wasm32 и падал на `getrandom` — а именно эта команда проверяет
# второй таргет ядра (принцип II).
default-members = ["packages/core"]
