[package]
name = "typsidian-desktop"
version = "0.1.0"
edition = "2021"
description = "Typsidian desktop shell (Tauri)"

# Оболочка, а не второе ядро: вся логика приходит из `typsidian-core` через
# `typsidian-shell`, как того требует plan.md → Project Structure. Здесь только
# точка входа и собственный `tauri.conf.json` (001 T112-T115, принцип I).

[lib]
name = "typsidian_desktop_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
typsidian-shell = { path = "../../../packages/shell" }
