packages:
  - ui
  - apps/*

# Сборочные скрипты пакетов разрешаются поимённо (pnpm ≥10): esbuild кладёт
# платформенный бинарь в свой postinstall, и без него не работает Vite, на
# котором собирается оболочка рабочего стола (001 T112).
allowBuilds:
  esbuild: true

# `react-dom` обязан быть ровно один и той же мажорной версии, что `react`.
#
# Без этой строки pnpm ставил под `@excalidraw/excalidraw` собственный
# `react-dom@18.3.1` рядом с `react@19.2.8`: у движка peer-диапазон допускает
# React 17/18/19, а вложенные в него `@radix-ui/*@1.0.x` объявляют потолком 18,
# и разрешение peer'ов сходилось на восемнадцатом.
#
# Смесь не просто нежелательна — она не работает: `react-dom@18` читает
# `ReactCurrentBatchConfig` из внутренностей React, которых в 19 больше нет, и
# падает с `Cannot read properties of undefined`. Падало это при открытии доски,
# а так как ни одной границы ошибок в приложении нет, вместе с движком
# исчезало всё окно.
overrides:
  react-dom: "^19.2.0"
