<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":750}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { on: { notes: true, boards: true, attach: false, linked: false } };
  }
  renderVals() {
    const W = 560;
    const H = 652;
    const names = ['Результаты', 'Методология', 'Введение', 'Обсуждение', 'План работы', 'Схема установки', 'Протокол №4', 'Литература', 'Термопары', 'Калибровка', 'Модель', 'Заключение', 'Нагреватель', 'Серия 7', 'Таблицы', 'Глоссарий'];
    const pts = names.map((label, i) => {
      const a = (i / names.length) * Math.PI * 2 + (i % 3) * 0.35;
      const r = i === 0 ? 0 : 120 + ((i * 53) % 130);
      return { label: label, x: W / 2 + Math.cos(a) * r, y: H / 2 + Math.sin(a) * r * 0.9 };
    });
    const edges = [[0, 1], [0, 3], [0, 4], [0, 5], [0, 6], [0, 13], [0, 14], [1, 6], [1, 8], [1, 9], [2, 4], [2, 7], [3, 10], [3, 11], [5, 12], [8, 9], [10, 7], [11, 3], [6, 15], [13, 9]];
    const seg = (e) => 'M' + pts[e[0]].x.toFixed(1) + ' ' + pts[e[0]].y.toFixed(1) + 'L' + pts[e[1]].x.toFixed(1) + ' ' + pts[e[1]].y.toFixed(1);
    const broken = [12, 15];
    const nodes = pts.map((p, i) => {
      const deg = edges.filter((e) => e[0] === i || e[1] === i).length;
      const r = 4 + deg * 1.6;
      return {
        label: p.label,
        left: (p.x / W * 100).toFixed(2) + '%',
        top: (p.y / H * 100).toFixed(2) + '%',
        shift: (-r).toFixed(1) + 'px',
        size: (r * 2).toFixed(1) + 'px',
        fill: i === 0 ? '#ff6a00' : '#9aa3ac',
        ring: broken.indexOf(i) >= 0 ? '0 0 0 2px #1b1f24, 0 0 0 4px #ffd400' : 'none',
        labelColor: i === 0 ? '#eceff1' : '#9aa3ac'
      };
    });
    const labels = { notes: 'Заметки', boards: 'Доски', attach: 'Вложения', linked: 'Только связанные с открытой' };
    const on = this.state.on;
    const toggles = ['notes', 'boards', 'attach', 'linked'].map((k) => ({
      label: labels[k],
      checked: on[k] ? 'true' : 'false',
      track: on[k] ? '#d94f00' : '#353c44',
      knob: on[k] ? '#ffffff' : '#c2c8ce',
      knobLeft: on[k] ? '14px' : '2px',
      flip: () => this.setState({ on: Object.assign({}, this.state.on, { [k]: !this.state.on[k] }) })
    }));
    return {
      nodes: nodes,
      toggles: toggles,
      edgesD: edges.map(seg).join(' '),
      hotD: edges.filter((e) => e[0] === 0).map(seg).join(' ')
    };
  }
}
</script>
