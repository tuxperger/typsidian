[package]
name = "typsidian-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `FakeBridge` виден интеграционным тестам в tests/ только через фичу:
# они линкуются с крейтом как с внешней зависимостью, собранной БЕЗ cfg(test)
# (research.md §15). Включается ниже через dev-dependency на самого себя.
test-support = []

[dependencies]
# Компилятор Typst (фича 005). Собирается под оба таргета — проверено сборкой
# зонда под wasm32-unknown-unknown (005/research.md §1), это было главное
# условие принципа II для всей фичи.
#
# `typst-assets` СОЗНАТЕЛЬНО не объявлен: он приходит транзитивно из
# `typst-library` и без feature `fonts`, а именно это нам и нужно. Включённая
# feature вшила бы 9,6 МБ шрифтов внутрь wasm-модуля (+4,1 МБ к сжатой
# доставке), тогда как шрифты обязаны ехать отдельными кэшируемыми файлами и
# иметь собственный жизненный цикл (005/research.md §6).
typst = "0.15.1"
typst-layout = "0.15.1"
typst-svg = "0.15.1"
# Экспорт в PDF (фича 009). Та же версия, что у остального Typst: вёрстка
# приходит из того же `PagedDocument`, что и у предпросмотра. Под wasm32
# собирается вместе с `krilla` без правок — проверено зондом до планирования
# (009/research.md §1).
typst-pdf = "0.15.1"
# ВРЕМЕННО с feature `fonts` (005 T029 это снимает).
#
# Без единого шрифта Typst не верстает текст вовсе, а отдельная поставка
# шрифтов файлами — самостоятельная задача. Чтобы предпросмотр заработал
# раньше, чем она сделана, набор пока вшит в модуль. Цена известна и измерена:
# +9,6 МБ к модулю, +4,1 МБ к сжатой доставке (005/research.md §6).
#
# Это НЕ конечное состояние: T029 переносит набор в отдельные кэшируемые файлы,
# после чего feature отсюда убирается.
typst-assets = { version = "0.15.1", features = ["fonts"] }
serde = { version = "1", features = ["derive"] }
# Разбор содержимого доски ровно в объёме нормализации для хэша (фича 002,
# research.md §5, §9). Модель Excalidraw ядром не воспроизводится: содержимое
# доски пересекает границу непрозрачными байтами. Ключи `Map` по умолчанию
# отсортированы — это и даёт канонический порядок без отдельного кода.
#
# Он же — формат обоих файлов настроек: `settings.json` устройства и
# `.typsidian/vault.json` папки заметок (004/research.md §2, пересмотрено).
# Feature `preserve_order` включать НЕЛЬЗЯ: `boards::digest` рассчитывает ровно
# на сортировку ключей, и её отключение изменило бы хэш каждой доски в проекте
# (подробнее — в шапке `settings::format`).
serde_json = "1"
blake3 = "1"
# Поиск по vault: подстрока и regex идут одним путём — совпадения и регистр
# обязаны считаться одинаково, а два разных механизма разошлись бы. Крейт уже
# приезжает транзитивно с `typst`, поэтому объявление его прямой зависимостью
# ничего не добавляет ни к сборке, ни к весу модуля.
regex = "1"
# Библиография vault (фича 017, research.md §1): чтение `.bib` и Hayagriva `.yml`
# тем же кодом, что у сборки Typst. Все три уже приезжают с `typst-library` в
# тех же версиях, веса не добавляют.
hayagriva = "0.10.1"
biblatex = "0.12.0"
serde_yaml = "0.9"
thiserror = "1"
# Загрузка внешних шаблонов Typst (фича 007). Три зависимости, все — под ОБА
# таргета, и это проверено зондами до планирования (007/research.md §1):
#
# `reqwest` сам является платформенной абстракцией: под native он работает через
# `hyper`, под wasm32 — через `fetch` браузера. Поэтому отдельного трейта
# загрузчика с двумя реализациями не заводится вовсе — принцип II допускает
# такой трейт, но здесь не нужен и он. `.timeout()` есть в обоих бэкендах
# (007/research.md §2), значит и предел ожидания задаётся одним вызовом.
#
# `default-features = false` существенно: иначе под native приедет `native-tls`
# с системным OpenSSL, чего на NixOS лучше избегать — TLS ниже включается
# явным `rustls-tls`.
reqwest = { version = "0.12", default-features = false }
# Распаковка архива шаблона ЦЕЛИКОМ В ПАМЯТИ, без файловой системы: на wasm32 её
# нет, а проверить все записи архива нужно до создания первого файла
# (007 FR-019, FR-020). `rust_backend` у flate2 — чистый Rust вместо системного
# zlib, по той же причине, что и `default-features = false` выше.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
# Трёхстороннее слияние текста (фича 011, research §11): diff3 поверх Myers.
# Чистый Rust, собирается под оба таргета.
similar = "2"
# Идентификатор устройства для модели хранителя истории (фича 011, research §4).
# Версия 0.2 уже приезжает транзитивно; под wasm32 ей нужен `js` (ниже).
getrandom = "0.2"
# Импорт из Obsidian (фича 021, research.md §1, §5): разбор Markdown и перевод
# формул LaTeX в Typst. Оба крейта — чистый Rust, без нативных библиотек.
pulldown-cmark = { version = "0.13", default-features = false }
mitex = "0.2.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Движок git на native (фича 011, research §1, §2). Без встроенных `https`/`ssh`:
# они потянули бы системный OpenSSL и libssh2. HTTPS даёт свой транспорт на
# `reqwest` (feature `blocking` ниже), SSH — системный клиент `ssh`.
# `vendored-libgit2` собирает libgit2 из исходников через `cc` — проверено
# зондом до реализации (libgit2 1.9.7, без cmake).
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
# TLS только под native: в браузере им занимается сам `fetch`.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
notify = "6"
notify-debouncer-full = "0.3"
# Каталог конфигурации по правилам платформы (research.md §1): путь показывается
# пользователю (FR-036), поэтому обязан быть тем, который он ожидает на своей ОС.
directories = "5"
sqlx = { version = "0.7", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "sync", "time"] }
jwalk = "0.8"

# Корзина ОС — не «не-wasm», а «есть далеко не везде». Под Android крейт не
# собирается: его платформенные модули исключают `target_os = "android"` явным
# cfg, и без этого таргетного условия падает вся мобильная сборка ядра. Ветку
# без корзины держит `native::move_to_trash`.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android")))'.dependencies]
trash = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
tsify-next = { version = "0.5", default-features = false, features = ["js"] }
web-sys = { version = "0.3", features = [
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetFileOptions",
    "FileSystemRemoveOptions",
    "Window",
    # Хранилище настроек в OPFS и атомарная запись с фиксацией на close()
    # (research.md §1, §5).
    "Navigator",
    "StorageManager",
    "FileSystemWritableFileStream",
    "FileSystemCreateWritableOptions",
    # Реестр ссылок на папки vault: FileSystemDirectoryHandle невозможно
    # сериализовать в JSON, поэтому хендлы живут в IndexedDB под ключом VaultId
    # (research.md §1, §10). Значения настроек сюда не попадают.
    "IdbFactory",
    "IdbDatabase",
    "IdbObjectStore",
    "IdbRequest",
    "IdbOpenDbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "DomException",
    # Секреты синхронизации в IndexedDB (фича 011, research §10).
    "DomStringList",
    "Event",
    "EventTarget",
] }


[dev-dependencies]
tempfile = "3"
# Сборка архива шаблона в тестах (фича 007): интеграционные тесты линкуются с
# крейтом как с внешней зависимостью и его собственных зависимостей не видят.
# Проверять разбор надо на настоящем gzip+tar, а не на заглушке — иначе
# проверялся бы не тот путь, которым пойдут настоящие данные.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Зависимость крейта на самого себя с включённой `test-support` — так
# интеграционные тесты в tests/ видят `FakeBridge` (research.md §15). Cargo
# такой цикл через dev-dependencies допускает намеренно.
typsidian-core = { path = ".", features = ["test-support"] }

# `harness = false` — бенчмарки меряют сквозные сценарии (SC-002, SC-003,
# SC-005), а не микрооперации: встроенный harness `#[bench]` требует nightly,
# а criterion добавил бы зависимость ради одного `Instant::now()`.
[[bench]]
name = "vault_scale"
harness = false

[[bench]]
name = "vault_bulk_change"
harness = false

# Нормализация и хэш доски на пределе в 2 000 элементов (фича 002, SC-005).
[[bench]]
name = "board_digest"
harness = false

# Предпросмотр на потолке гарантий в 50 страниц (фича 005, SC-001…SC-003,
# SC-006).
[[bench]]
name = "preview_scale"
harness = false

# Цикл резолва на заметке с большим внешним шаблоном: повторный показ обязан
# идти по кэшу шаблонов, а не поднимать их заново по файлу за проход.
[[bench]]
name = "preview_resolve"
harness = false

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# Сводка и список изменений истории на 5 000 заметок (фича 011, SC-002).
[[bench]]
name = "sync_status"
harness = false

# Оглавление заметки на 10 000 строк и 2 000 заголовков (фича 015, T045,
# research.md §9).
[[bench]]
name = "structure_scale"
harness = false

# Разбор, поиск и индекс цитат библиографии (фича 017, T054, SC-002, SC-004).
[[bench]]
name = "sources_scale"
harness = false

# Отбор по свойствам в vault из 10 000 заметок (фича 020, SC-001).
[[bench]]
name = "properties_scale"
harness = false

# Сбор `slides` на презентации из 100 страниц против сборки (фича 019, T030,
# research.md §11). `test-support` приходит из dev-зависимости на сам крейт.
[[bench]]
name = "slides_scale"
harness = false

# Полный цикл импорта из Obsidian на 2 000 заметок (фича 021, T023, SC-004,
# research.md §12).
[[bench]]
name = "import_scale"
harness = false

# Граф связей на 5 000 заметок и 15 000 связей (фича 025, T011, SC-001,
# research.md §9).
[[bench]]
name = "graph_view"
harness = false
