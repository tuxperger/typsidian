# Гейты качества на каждый пуш и PR — те же, что локально:
# `.specify/scripts/typsidian/gates.sh all` (Definition of done конституции).
#
# Тулчейн берётся из флейка, как и на машине разработчика: вне `nix develop`
# нет ни cargo, ни pnpm, ни wasm-pack, и версии wasm-bindgen в `Cargo.lock` и
# CLI обязаны совпадать — флейк это и гарантирует.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Раннер даёт ~14 ГБ свободного места, а dev-shell (chromium, WebKitGTK) и
# сборка Typst под два таргета с тестами в них не помещаются: первый прогон
# упал на `cargo test` с «No space left on device». Отладочная информация —
# большая часть `target/`, и в CI её никто не читает; инкрементальная сборка
# на чистом раннере тоже только занимает место.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  gates:
    name: Гейты (ядро под оба таргета, типы, i18n, web)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Предустановленные SDK, которыми сборка не пользуется: ~25 ГБ.
      - name: Освободить диск раннера
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Ubuntu 24.04 запрещает непривилегированные user namespaces через
      # AppArmor, а без них песочница chromium не стартует — и
      # wasm-bindgen-test падает ещё до первого теста.
      - name: Разрешить песочницу chromium
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # На образе раннера предустановлен Google Chrome своей версии, и
      # chromedriver из флейка находит по PATH его раньше, чем chromium из
      # dev-shell: версии не сходятся, сессия не создаётся. Локально системного
      # браузера нет — оставляем раннеру тоже только тот, что даёт флейк.
      - name: Убрать системные браузеры
        run: |
          sudo rm -f /usr/bin/google-chrome /usr/bin/google-chrome-stable \
            /usr/bin/chromium /usr/bin/chromium-browser /usr/bin/chromedriver
          sudo rm -rf /opt/google/chrome

      # Typst собирается долго; ключ — лок-файлы зависимостей и тулчейна.
      - uses: actions/cache@v4
        id: cargo-cache
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Dev-shell
        run: nix develop -c true

      # wasm-bindgen-test при незапустившемся браузере сообщает только
      # «http status: 404» — и то через полчаса сборки. Здесь chromium
      # запускается напрямую: причина видна сразу и своими словами.
      - name: Chromium из dev-shell стартует
        run: |
          # CHROME_PATH выставляет shellHook, раскрыть его должен внутренний sh.
          # shellcheck disable=SC2016
          nix develop -c sh -c '"$CHROME_PATH" --headless --disable-gpu --dump-dom about:blank'

      - name: Зависимости фронтенда
        run: nix develop -c pnpm install --frozen-lockfile

      - name: Гейты ядра (fmt, i18n, оба таргета, cargo test, wasm-bindgen-test)
        run: nix develop -c .specify/scripts/typsidian/gates.sh core

      - name: Гейты фронтенда (wasm → ui → typecheck)
        run: nix develop -c .specify/scripts/typsidian/gates.sh ui

      - name: Роадмап соответствует спекам
        run: .specify/scripts/typsidian/roadmap.sh --check

      - name: Сборка web-клиента
        run: nix develop -c pnpm build

      # actions/cache сохраняет только зелёный прогон, а красный на гейтах
      # иначе каждый раз пересобирал бы Typst с нуля.
      - uses: actions/cache/save@v4
        if: failure() && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
